[project]
name = "umud"
version = "0.1.0"
description = "UMUD Challenge: muscle architecture (PA/FL/MT) from B-mode ultrasound"
requires-python = ">=3.12,<3.13"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "torch>=2.5",
    "torchvision>=0.20",
    "segmentation-models-pytorch>=0.4",
    "albumentations>=1.4",
    "opencv-python-headless>=4.10",
    "tifffile>=2024.8.30",
    "imagecodecs>=2024.9.22",
    "scikit-image>=0.24",
    "scipy>=1.14",
    "numpy>=1.26,<3",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "kaggle>=2.2.4",
    "pytesseract>=0.3.13",
    "openpyxl>=3.1.5",
    "tensorflow>=2.16",
    "tf-keras>=2.21.0",
]

[project.optional-dependencies]
dev = ["ipykernel", "jupyter", "pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/umud"]
